services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: food-ordering-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Disable the image CDS archive because it fails with the bundled JDK.
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xshare:off"
      # Disable JMX because the image cannot start its management agent.
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote=false"

  kafka-ui:
    image: redpandadata/console:v2.8.6
    container_name: food-ordering-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka
